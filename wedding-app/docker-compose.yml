# ============================================================
# Production stack — runs on your $5/mo VPS.
#
# Two services:
#   app    — Fastify + React + SQLite (one container)
#   caddy  — reverse proxy with AUTOMATIC HTTPS via Let's Encrypt
#
# To deploy:
#   1. Point your domain's A record at the VPS IP
#   2. Edit deploy/Caddyfile and replace `yourwedding.example.com`
#   3. Set JWT_SECRET and WEDDING_SECRETS_KEY in .env (generate each with:
#      openssl rand -hex 32). The latter encrypts integration credentials.
#   4. docker compose up -d
#
# That's it. Caddy gets a certificate in 30 seconds. App is live.
# ============================================================
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      WEDDING_SECRETS_KEY: ${WEDDING_SECRETS_KEY:?WEDDING_SECRETS_KEY must be set in .env}
      PORT: 3000
      LOG_LEVEL: info
    volumes:
      - wedding-data:/data           # SQLite + uploads persist here
    expose:
      - "3000"                       # only Caddy talks to it

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data             # cert storage
      - caddy-config:/config
    depends_on:
      - app

volumes:
  wedding-data:
  caddy-data:
  caddy-config:
