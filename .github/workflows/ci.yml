name: CI

# Runs the full quality gate for the wedding-app on every push / PR that
# touches it. Mirrors `npm run ci` but split into parallel jobs so a failure
# is easy to locate. All jobs must pass for the workflow to go green.

on:
  push:
    branches: [main]
    paths: ['wedding-app/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['wedding-app/**', '.github/workflows/ci.yml']

defaults:
  run:
    working-directory: wedding-app

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Security: fail on any high/critical advisory in production deps ──
  audit:
    name: npm audit (production, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run install:all
      - name: Audit (production deps, high+)
        run: npm run audit:prod

  # ── Typecheck + unit/integration tests (server + client) + build ──
  test:
    name: Typecheck · Tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run install:all
      - name: Typecheck
        run: npm run typecheck
      - name: Server tests + coverage
        run: npm run test:coverage
      - name: Client tests
        run: npm --prefix client test
      - name: Build (client + server)
        run: npm run build

  # ── Backend smoke test (boots the server, hits every domain endpoint) ──
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run install:all
      - name: Smoke
        run: npm run smoke

  # ── Production container validation ────────────────────────────────
  docker:
    name: Docker build · runtime health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        working-directory: wedding-app
        run: docker build --pull -t wedding-app-ci:${{ github.sha }} .
      - name: Start image and verify health endpoint
        run: |
          set -euo pipefail
          name=wedding-app-ci-${{ github.run_id }}
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" -p 127.0.0.1:3000:3000 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e WEDDING_SECRETS_KEY="$(openssl rand -hex 32)" \
            wedding-app-ci:${{ github.sha }}
          for _ in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$name"
          exit 1

  # ── Browser quality gates: axe-core (public surfaces) + e2e happy path ──
  # The a11y harness (scripts/a11y-test.sh) builds, seeds, and boots the real
  # server, then runs every *.a11y.spec.ts and *.e2e.spec.ts in Playwright.
  a11y:
    name: Browser gates (a11y + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run install:all
      - name: Install Playwright browser + OS deps
        run: npm --prefix client exec -- playwright install --with-deps chromium
      - name: Bundle-size budget gate
        run: npm run bundle:budget
      - name: Browser gates (axe-core a11y + e2e happy path)
        run: npm run a11y
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-report
          path: wedding-app/client/playwright-report/
          retention-days: 7
